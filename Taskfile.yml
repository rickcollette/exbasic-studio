version: '3'

vars:
  APP_NAME: "exbasic-studio"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'
  # The single source of the application version is the VERSION file.
  VERSION:
    sh: go run ./build/tools/version --print
  # Staged tools built from the pinned sources in third_party/.
  STAGE_DIR: '{{.ROOT_DIR}}/build/stage/{{OS}}-{{ARCH}}'
  BASH: '{{if eq OS "windows"}}"C:/Program Files/Git/bin/bash.exe"{{else}}bash{{end}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  toolchain:
    desc: Build exBASIC, ex800, ex800-studio, mkatr-go and EOS from pinned sources and stage them
    sources:
      - third_party/exbasic/source/src/**/*
      - third_party/exbasic/source/Makefile
      - third_party/ex800/ex800-1.0.0/src/**/*
      - third_party/ex800/ex800-1.0.0/configure
      - third_party/ex800/studio-helper/main.c
      - third_party/mkatrgo/**/*.go
      - third_party/mkatrgo/go.mod
      - third_party/mkatrgo/go.sum
      - third_party/exoperatingsystem/eos/**/*
      - third_party/exoperatingsystem/tools/*.py
      - third_party/exoperatingsystem/Makefile
      - third_party/exoperatingsystem/VERSION
      - third_party/exoperatingsystem/LICENSE
      - third_party/mads/bin/**/*
      - cmd/mkatr-go/**/*.go
      - build/tools/build-toolchain.sh
    generates:
      - build/stage/{{OS}}-{{ARCH}}/tools/**/*
    cmds:
      - '{{.BASH}} build/tools/build-toolchain.sh'

  build:
    desc: Build the application and its toolchain for the current platform
    cmds:
      - task: version:check
      - task: toolchain
      - task: "{{.GOOS}}:build"
      - task: tools:sync

  tools:sync:
    desc: Mirror the staged tools next to the built executable so bin/ runs as an installed copy does
    cmds:
      - '{{.BASH}} -c "rm -rf bin/tools && cp -R build/stage/{{OS}}-{{ARCH}}/tools bin/tools"'

  package:
    desc: Package a production build (installer/archive) for the current platform
    cmds:
      - task: version:check
      - task: toolchain
      - task: "{{.GOOS}}:package"

  run:
    desc: Run the application for the current platform
    env:
      EXBASIC_STUDIO_TOOLS: '{{.STAGE_DIR}}/tools'
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: Run the application with Go and frontend live reload
    deps: [toolchain]
    env:
      # Development builds find the staged tools through the explicit
      # override; packaged builds find them in the application resources.
      EXBASIC_STUDIO_TOOLS: '{{.STAGE_DIR}}/tools'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    desc: Run backend tests against the staged toolchain (no skipped tool tests)
    deps: [toolchain]
    env:
      EXBASIC_STUDIO_TOOLS: '{{.STAGE_DIR}}/tools'
      EXBASIC_STUDIO_REQUIRE_TOOLS: '1'
    cmds:
      - go test -buildvcs=false ./...

  test:frontend:
    desc: Run frontend type checks, unit tests and the production build
    dir: frontend
    cmds:
      - npm run check
      - npm run check:language
      - npm test
      - npm run build

  test:e2e:
    desc: Run browser end-to-end and accessibility tests against the mock backend
    dir: frontend
    cmds:
      - npx playwright test

  check:
    desc: Everything CI runs for a pull request
    cmds:
      - task: version:check
      - go vet -buildvcs=false ./...
      - task: bindings:check
      - task: test
      - task: test:frontend
      - task: test:e2e

  version:sync:
    desc: Apply the VERSION file to every build and package definition
    cmds:
      - go run ./build/tools/version

  version:check:
    desc: Fail if any build or package definition does not match VERSION
    cmds:
      - go run ./build/tools/version --check

  bindings:
    desc: Regenerate the frontend bindings from the Go service
    cmds:
      - task: common:generate:bindings

  bindings:check:
    desc: Fail if the checked-in bindings differ from the Go service
    cmds:
      - task: common:generate:bindings
      - git diff --exit-code -- frontend/bindings

  frontend:
    cmds:
      - task: common:build:frontend

  install:msix:tools:
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    cmds:
      - task: common:setup:docker
