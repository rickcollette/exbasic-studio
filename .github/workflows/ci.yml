name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0
  NODE_VERSION: "22"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, shell: bash }
          - { name: macOS arm64, os: macos-14, shell: bash }
          - { name: Windows x64, os: windows-2022, shell: "msys2 {0}" }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64 toolchain)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make mingw-w64-x86_64-gcc

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---- Dependency locks ------------------------------------------------
      - name: Verify Go module checksums
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install frontend dependencies from the lock file
        working-directory: frontend
        run: npm ci

      # ---- Generated files must be up to date --------------------------------
      - name: Version is applied everywhere
        run: go run ./build/tools/version --check

      - name: Language catalog and grammar match the syntax definitions
        working-directory: frontend
        run: npm run check:language

      - name: Frontend bindings match the Go service
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          wails3 generate bindings -clean=true -ts -i
          git diff --exit-code -- frontend/bindings

      # ---- Frontend ------------------------------------------------------------
      - name: Frontend type check, unit tests and production build
        working-directory: frontend
        run: |
          npm run check
          npm test
          npm run build

      # ---- Toolchain and backend -------------------------------------------------
      - name: Build the toolchain from pinned sources
        run: bash build/tools/build-toolchain.sh

      - name: Vendored sources are left clean by the build
        run: git diff --exit-code -- third_party && test -z "$(git status --porcelain -- third_party)"

      - name: Go vet
        run: go vet ./...

      - name: Go tests, including real compiler, emulator and debugger smoke tests
        env:
          EXBASIC_STUDIO_REQUIRE_TOOLS: "1"
        run: |
          export EXBASIC_STUDIO_TOOLS="$PWD/build/stage/$(go env GOOS)-$(go env GOARCH)/tools"
          go test ./...

      - name: Fuzz the parsers briefly
        if: runner.os == 'Linux'
        run: |
          go test ./internal/project -run '^$' -fuzz FuzzValidRel -fuzztime 20s
          go test ./internal/git -run '^$' -fuzz FuzzParseStatus -fuzztime 20s
          go test ./internal/compiler -run '^$' -fuzz FuzzParseMetadata -fuzztime 20s
          go test ./internal/debugger -run '^$' -fuzz FuzzParseWatch -fuzztime 20s

      - name: Build the application
        run: go build -tags production -ldflags "-X exbasicstudio/internal/version.Version=$(go run ./build/tools/version --print)" -o bin/ .

      # ---- Browser tests -----------------------------------------------------------
      - name: End-to-end and accessibility tests
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Go vulnerability database
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          mkdir -p frontend/dist && touch frontend/dist/.keep
          govulncheck ./...
      - name: npm advisories (high severity and above fail)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
